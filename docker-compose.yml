services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/db/kanban.db
      # If using Docker Desktop, use host.docker.internal to access Ollama on host
      # Linux users might need to use the host IP (e.g., 172.17.0.1)
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-please-change-me}
    volumes:
      - koge_data:/app/db
    restart: unless-stopped

volumes:
  koge_data:

