services:
  app:
    image: dezuhan/koge-kanban:latest
    build: .
    container_name: koge-kanban
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=your-secure-secret-key-here
      - ALLOWED_ORIGINS=http://localhost:3000
      # If using Docker Desktop, use host.docker.internal to access Ollama on host
      # For Linux users, you might need to use the host's IP address
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./db:/app/db
    restart: always

volumes:
  # This section can be used if you prefer managed volumes over bind mounts
  # koge_data:
